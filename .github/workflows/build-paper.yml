name: Build paper PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/main.tex'
      - 'paper/dashvmc-preprint.tex'
      - 'paper/dashvmc-submission.tex'
      - 'paper/references.bib'
      - 'paper/checklist.tex'
      - 'paper/neurips_2026.sty'
      - 'paper/Makefile'
      - 'paper/figures/continuation.png'
      - 'scripts/gen_counterfactual_spike.py'
      - 'scripts/render_counterfactual_spike_figure.py'
      - 'analysis/2026-07-21_counterfactual_spike/**'
      - 'docs/pipeline.tex'
      - '.github/workflows/build-paper.yml'
  pull_request:
    paths:
      - 'paper/main.tex'
      - 'paper/dashvmc-preprint.tex'
      - 'paper/dashvmc-submission.tex'
      - 'paper/references.bib'
      - 'paper/checklist.tex'
      - 'paper/neurips_2026.sty'
      - 'paper/Makefile'
      - 'paper/figures/continuation.png'
      - 'scripts/gen_counterfactual_spike.py'
      - 'scripts/render_counterfactual_spike_figure.py'
      - 'analysis/2026-07-21_counterfactual_spike/**'
      - 'docs/pipeline.tex'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile pipeline figure
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs
          root_file: pipeline.tex

      - name: Copy pipeline figure into paper
        run: cp docs/pipeline.pdf paper/figures/pipeline.pdf

      - name: Compile public preprint
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: dashvmc-preprint.tex

      - name: Compile anonymous submission
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: dashvmc-submission.tex

      - name: Copy paper PDF to docs
        run: cp paper/dashvmc-preprint.pdf docs/static/pdfs/dashvmc.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-preprint
          path: paper/dashvmc-preprint.pdf

      - name: Commit updated PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/static/pdfs/dashvmc.pdf; then
            echo "No PDF changes"
            exit 0
          fi
          git add docs/static/pdfs/dashvmc.pdf
          git commit -m "ci: rebuild paper PDF [skip ci]"
          git push
