# Atari Pong H200 fixed real-warmup controller rerun.
#
# First supercomputer target:
#   1. collect 10K random-policy replay,
#   2. train FSQ on cumulative replay,
#   3. train frozen-token predictors for CE and SLS,
#   4. use this as the base for the Atari actor/control loop.

model:
  vocab_size: 1000
  embed_dim: 384
  n_heads: 8
  n_layers: 8
  tokens_per_frame: 256
  context_frames: 4
  levels: [8, 5, 5, 5]
  dropout: 0.1
  adaln: false
  img_channels: 3

atari:
  game: Pong
  out_dir: data/atari/Pong_realwarmup_fixed
  replay_dir: data/atari/Pong_realwarmup_fixed/replay
  shard_size: 8192
  warmup_steps: 10000
  cycle_steps: 10000
  total_budget_steps: 100000
  frame_skip: 4
  repeat_action_probability: 0.0
  seed: 42

full_cycle:
  run_dir: runs/atari_pong_h200_realwarmup_fixed_full
  wandb_project: sls-wm-atari
  wandb_name: atari-pong-realwarmup-fixed-full
  warmup_steps: 10000
  cycle_steps: 10000
  total_budget_steps: 100000
  final_mode: evaluation_clean  # evaluation_clean or max_performance
  skip_real_actor_cycle0: true
  # Keep full-cycle debugging focused on controller transfer. Train the world
  # model after random warmup and after meaningful replay shifts, then spend
  # the rest of the budget on policy improvement/evaluation instead of
  # repeating multi-hour SLS refreshes on every 10K step boundary.
  wm_refresh_steps: [10000, 30000, 60000]
  skip_wm_at_budget: true
  fsq_warmstart_epochs: 10
  predictor_warmstart_epochs: 5
  predictor_warmstart_warmup_epochs: 1
  predictor_sls_warmstart_epochs: 5
  predictor_sls_warmstart_warmup_epochs: 1
  # Do real-environment PPO collection/update for two policy cycles after
  # random warmup before letting dream PPO affect the policy.
  dream_start_steps: 30000
  post_dream_real_steps: 10000
  phase_overrides:
    predictor_sls:
      reward_balanced_sampler: true
      reward_sample_neg_weight: 10
      reward_sample_pos_weight: 1000
      reward_loss_weight: 10
      rollout_consistency_loss_weight: 1.0
      rollout_consistency_token_loss_weight: 1.0
      rollout_consistency_reward_loss_weight: 1.0
      rollout_consistency_event_loss_weight: 2.0
      rollout_consistency_done_loss_weight: 0.25
      rollout_consistency_batch_size: 24
      rollout_consistency_horizon: 15
      rollout_consistency_min_gap: 3
      rollout_consistency_max_gap: 13
      rollout_consistency_event_quota_sampler: true
      rollout_consistency_event_fraction: 0.9
      rollout_consistency_pos_fraction: 0.5
      rollout_consistency_event_zero_weight: 1.0
      rollout_consistency_event_neg_weight: 1.0
      rollout_consistency_event_pos_weight: 1.0
    actor_real:
      actor_update: iris_pg
      entropy_coeff: 0.01
      policy_action_subset: ""
      random_action_prob: 0.25
    actor_dream:
      actor_update: iris_pg
      entropy_coeff: 0.01
      policy_action_subset: ""
    evaluation:
      policy_action_subset: ""

fsq:
  episodes_dir: data/atari/Pong_realwarmup_fixed/episodes
  replay_dir: data/atari/Pong_realwarmup_fixed/replay
  expert_episodes_dir: data/atari/Pong_realwarmup_fixed/_no_expert
  img_channels: 3
  norm_type: group
  levels: [8, 5, 5, 5]
  latent_grid: 16
  epochs: 100
  batch_size: 256
  lr: 0.0001
  lr_min: 0.000001
  alpha_slow: 0.0
  alpha_uniform: 0.1
  recon_loss_type: l1
  recon_reduction: mean
  recon_weight_mode: none
  foreground_weight: 0.0
  foreground_weight_max: 25.0
  perceptual_loss: lpips
  perceptual_weight: 1.0
  augment_shift: false
  val_interval: 5
  seed: 42
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  checkpoint_dir: checkpoints_atari_pong_h200_realwarmup_fixed

predictor:
  replay_dir: data/atari/Pong_realwarmup_fixed/replay
  fsq_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed/fsq_best.pt
  tokenizer_config: configs/atari/atari_pong_h200_realwarmup_fixed.yaml
  n_actions: 6
  epochs: 20
  batch_size: 128
  lr: 0.0002
  lr_min: 0.00001
  warmup_epochs: 3
  weight_decay: 0.01
  val_ratio: 0.2
  eval_horizons: [1, 5, 10, 15]
  label_smoothing: 0.0
  fsq_kernel: gaussian
  fsq_sigma: 0.9
  focal_gamma: 0.0
  reward_loss_weight: 1.0
  reward_head_type: twohot
  reward_twohot_bins: 255
  reward_twohot_low: -25.0
  reward_twohot_high: 25.0
  reward_event_head: true
  reward_event_loss_weight: 2.0
  reward_event_zero_weight: 1.0
  reward_event_neg_weight: 10.0
  reward_event_pos_weight: 200.0
  done_loss_weight: 1.0
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  val_interval: 5
  max_val_batches: 64
  max_rollout_batches: 16
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_realwarmup_fixed_predictor_ce

predictor_sls:
  replay_dir: data/atari/Pong_realwarmup_fixed/replay
  fsq_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed/fsq_best.pt
  tokenizer_config: configs/atari/atari_pong_h200_realwarmup_fixed.yaml
  n_actions: 6
  epochs: 20
  batch_size: 128
  lr: 0.0002
  lr_min: 0.00001
  warmup_epochs: 3
  weight_decay: 0.01
  val_ratio: 0.2
  eval_horizons: [1, 5, 10, 15]
  label_smoothing: 0.1
  fsq_kernel: gaussian
  fsq_sigma: 0.9
  focal_gamma: 0.0
  reward_loss_weight: 1.0
  reward_head_type: twohot
  reward_twohot_bins: 255
  reward_twohot_low: -25.0
  reward_twohot_high: 25.0
  reward_event_head: true
  reward_event_loss_weight: 2.0
  reward_event_zero_weight: 1.0
  reward_event_neg_weight: 10.0
  reward_event_pos_weight: 200.0
  done_loss_weight: 1.0
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  val_interval: 5
  max_val_batches: 64
  max_rollout_batches: 16
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_realwarmup_fixed_predictor_sls

actor_real:
  game: Pong
  replay_dir: data/atari/Pong_realwarmup_fixed/replay
  fsq_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed/fsq_best.pt
  # Start with the SLS predictor for the policy path; override to CE for ablations.
  predictor_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed_predictor_sls/predictor_best.pt
  n_steps: 10000
  rollout_steps: 256
  lr: 0.00025
  gamma: 0.997
  lam: 0.95
  clip_eps: 0.2
  ppo_epochs: 4
  minibatch_size: 256
  entropy_coeff: 0.01
  random_action_prob: 0.25
  critic_coeff: 0.5
  max_grad_norm: 0.5
  value_head_type: twohot
  value_twohot_bins: 255
  value_twohot_low: -25.0
  value_twohot_high: 25.0
  return_normalizer_momentum: 0.99
  ema_decay: 0.995
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_realwarmup_fixed_actor_real

actor_dream:
  replay_dir: data/atari/Pong_realwarmup_fixed/replay
  fsq_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed/fsq_best.pt
  predictor_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed_predictor_sls/predictor_best.pt
  pretrained: checkpoints_atari_pong_h200_realwarmup_fixed_actor_real/actor_real_latest.pt
  n_iterations: 250
  n_episodes: 256
  imagined_to_collected_ratio: 64
  max_dream_steps: 15
  temperature: 0.0
  done_threshold: 0.5
  reward_clip_min: -1.0
  reward_clip_max: 1.0
  reward_mode: discrete
  reward_discrete_threshold: 0.5
  reward_event_sample_frac: 0.9
  reward_event_pos_frac: 0.5
  reward_event_min_gap: 3
  reward_event_max_gap: 13
  stop_on_reward: true
  reward_done_epsilon: 0.5
  lr: 0.00025
  gamma: 0.997
  lam: 0.95
  clip_eps: 0.2
  ppo_epochs: 4
  minibatch_size: 512
  entropy_coeff: 0.01
  critic_coeff: 0.5
  max_grad_norm: 0.5
  value_head_type: twohot
  value_twohot_bins: 255
  value_twohot_low: -25.0
  value_twohot_high: 25.0
  return_normalizer_momentum: 0.99
  ema_decay: 0.995
  real_eval_interval: 50
  real_eval_episodes: 5
  real_eval_max_steps: 27000
  real_eval_seed: 20042
  reward_calibration_samples: 256
  reward_calibration_horizon: 15
  dream_gate: true
  dream_gate_miss_rate: 0.25
  dream_gate_false_positive_rate: 0.20
  dream_gate_sign_accuracy: 0.80
  dream_gate_require_positive_events: true
  dream_gate_real_eval_episodes: 1
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_realwarmup_fixed_actor_dream

actor_iris:
  replay_dir: data/atari/Pong_realwarmup_fixed/replay
  fsq_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed/fsq_best.pt
  predictor_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed_predictor_sls/predictor_best.pt
  # IRIS-style policy path: recurrent CNN over reconstructed frames,
  # event-balanced lambda-return actor-critic in dreams.
  policy_action_subset: ""
  n_iterations: 2000
  batch_num_samples: 128
  imagine_horizon: 20
  lr: 0.0001
  gamma: 0.995
  lambda_: 0.95
  entropy_weight: 0.003
  max_grad_norm: 0.5
  train_temperature: 1.0
  world_model_temperature: 0.0
  reward_mode: event_threshold
  done_mode: threshold
  reward_clip_min: -1.0
  reward_clip_max: 1.0
  reward_discrete_threshold: 0.5
  done_threshold: 0.5
  reward_event_sample_frac: 0.9
  reward_event_pos_frac: 0.5
  reward_event_min_gap: 3
  reward_event_max_gap: 13
  stop_on_reward: true
  reward_done_epsilon: 0.5
  eval_interval: 50
  eval_episodes: 16
  eval_max_steps: 27000
  eval_temperature: 1.0
  eval_sample: false
  eval_seed: 20042
  amp_dtype: bfloat16
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_realwarmup_fixed_actor_iris

evaluation:
  n_episodes: 20
  max_steps_per_episode: 27000
  actor_checkpoint: checkpoints_atari_pong_h200_realwarmup_fixed_actor_dream/actor_dream_best_real.pt
  output: runs/atari_pong_h200_realwarmup_fixed_full/evaluation.json
  seed: 10042
