# First Atari port test config. Mirrors V7 architecture spec but with
# img_channels=3 (RGB input) and Pong-specific data directory. Used to
# validate the V7 pipeline end-to-end on Atari frames before scaling up
# to the full multi-game / multi-seed Tier 1 sweep (see #14).

model:
  vocab_size: 1000
  embed_dim: 384
  n_heads: 8
  n_layers: 8
  tokens_per_frame: 64
  context_frames: 4
  levels: [8, 5, 5, 5]
  dropout: 0.1
  adaln: false
  img_channels: 3

fsq:
  episodes_dir: data/atari/Pong/episodes
  expert_episodes_dir: data/atari/Pong/_no_expert  # graceful skip if missing
  img_channels: 3
  levels: [8, 5, 5, 5]
  epochs: 10  # smoke test; scale up once reconstructions look reasonable
  batch_size: 256
  lr: 0.001
  lr_min: 0.00001
  alpha_slow: 0.1
  alpha_uniform: 0.01
  val_interval: 2
  seed: 42
  amp_dtype: none
  compile_mode: none
  checkpoint_dir: checkpoints_atari_pong
