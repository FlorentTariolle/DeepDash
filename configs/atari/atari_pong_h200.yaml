# Atari Pong H200 prototype.
#
# First supercomputer target:
#   1. collect 10K random-policy replay,
#   2. train FSQ on cumulative replay,
#   3. train frozen-token predictors for CE and SLS,
#   4. use this as the base for the Atari actor/control loop.

model:
  vocab_size: 1000
  embed_dim: 384
  n_heads: 8
  n_layers: 8
  tokens_per_frame: 256
  context_frames: 4
  levels: [8, 5, 5, 5]
  dropout: 0.1
  adaln: false
  img_channels: 3

atari:
  game: Pong
  out_dir: data/atari/Pong
  replay_dir: data/atari/Pong/replay
  shard_size: 8192
  warmup_steps: 10000
  cycle_steps: 10000
  total_budget_steps: 100000
  frame_skip: 4
  repeat_action_probability: 0.0
  seed: 42

full_cycle:
  run_dir: runs/atari_pong_h200_full
  wandb_project: sls-wm-atari
  wandb_name: atari-pong-full
  warmup_steps: 10000
  cycle_steps: 10000
  total_budget_steps: 100000
  final_mode: evaluation_clean  # evaluation_clean or max_performance
  skip_real_actor_cycle0: true
  phase_overrides: {}

fsq:
  episodes_dir: data/atari/Pong/episodes
  replay_dir: data/atari/Pong/replay
  expert_episodes_dir: data/atari/Pong/_no_expert
  img_channels: 3
  norm_type: group
  levels: [8, 5, 5, 5]
  latent_grid: 16
  epochs: 100
  batch_size: 256
  lr: 0.0001
  lr_min: 0.000001
  alpha_slow: 0.0
  alpha_uniform: 0.1
  recon_loss_type: l1
  recon_reduction: mean
  recon_weight_mode: none
  foreground_weight: 0.0
  foreground_weight_max: 25.0
  perceptual_loss: lpips
  perceptual_weight: 1.0
  augment_shift: false
  val_interval: 5
  seed: 42
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  checkpoint_dir: checkpoints_atari_pong_h200

predictor:
  replay_dir: data/atari/Pong/replay
  fsq_checkpoint: checkpoints_atari_pong_h200/fsq_best.pt
  tokenizer_config: configs/atari/atari_pong_h200.yaml
  n_actions: 6
  epochs: 20
  batch_size: 128
  lr: 0.0002
  lr_min: 0.00001
  warmup_epochs: 3
  weight_decay: 0.01
  val_ratio: 0.2
  eval_horizons: [1, 5, 10, 15]
  label_smoothing: 0.0
  fsq_kernel: gaussian
  fsq_sigma: 0.9
  focal_gamma: 0.0
  reward_loss_weight: 1.0
  done_loss_weight: 1.0
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  val_interval: 5
  max_val_batches: 64
  max_rollout_batches: 16
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_predictor_ce

predictor_sls:
  replay_dir: data/atari/Pong/replay
  fsq_checkpoint: checkpoints_atari_pong_h200/fsq_best.pt
  tokenizer_config: configs/atari/atari_pong_h200.yaml
  n_actions: 6
  epochs: 20
  batch_size: 128
  lr: 0.0002
  lr_min: 0.00001
  warmup_epochs: 3
  weight_decay: 0.01
  val_ratio: 0.2
  eval_horizons: [1, 5, 10, 15]
  label_smoothing: 0.1
  fsq_kernel: gaussian
  fsq_sigma: 0.9
  focal_gamma: 0.0
  reward_loss_weight: 1.0
  done_loss_weight: 1.0
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  val_interval: 5
  max_val_batches: 64
  max_rollout_batches: 16
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_predictor_sls

actor_real:
  game: Pong
  replay_dir: data/atari/Pong/replay
  fsq_checkpoint: checkpoints_atari_pong_h200/fsq_best.pt
  # Start with the SLS predictor for the policy path; override to CE for ablations.
  predictor_checkpoint: checkpoints_atari_pong_h200_predictor_sls/predictor_best.pt
  n_steps: 10000
  rollout_steps: 256
  lr: 0.00025
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  ppo_epochs: 4
  minibatch_size: 256
  entropy_coeff: 0.01
  critic_coeff: 0.5
  max_grad_norm: 0.5
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_actor_real

actor_dream:
  replay_dir: data/atari/Pong/replay
  fsq_checkpoint: checkpoints_atari_pong_h200/fsq_best.pt
  predictor_checkpoint: checkpoints_atari_pong_h200_predictor_sls/predictor_best.pt
  pretrained: checkpoints_atari_pong_h200_actor_real/actor_real_latest.pt
  n_iterations: 500
  n_episodes: 256
  max_dream_steps: 20
  temperature: 0.0
  done_threshold: 0.5
  reward_clip_min: -1.0
  reward_clip_max: 1.0
  reward_mode: discrete
  reward_discrete_threshold: 0.5
  reward_event_sample_frac: 0.9
  reward_event_pos_frac: 0.5
  reward_event_min_gap: 3
  reward_event_max_gap: 13
  stop_on_reward: true
  reward_done_epsilon: 0.5
  lr: 0.00025
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  ppo_epochs: 4
  minibatch_size: 512
  entropy_coeff: 0.001
  critic_coeff: 0.5
  max_grad_norm: 0.5
  real_eval_interval: 50
  real_eval_episodes: 5
  real_eval_max_steps: 27000
  real_eval_seed: 20042
  reward_calibration_samples: 256
  reward_calibration_horizon: 20
  amp_dtype: bfloat16
  compile_mode: reduce-overhead
  seed: 42
  checkpoint_dir: checkpoints_atari_pong_h200_actor_dream

evaluation:
  n_episodes: 20
  max_steps_per_episode: 27000
  actor_checkpoint: checkpoints_atari_pong_h200_actor_dream/actor_dream_best_real.pt
  output: runs/atari_pong_h200_full/evaluation.json
  seed: 10042
